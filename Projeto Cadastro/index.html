<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>Adicionar Produto</h2>
        <form id="form-produto" onsubmit="cadastrarProduto(event)">
            <div class="campo">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" placeholder="Ex: Camiseta, Teclado, etc." required>
            </div>

            <div class="campo">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" min="0" placeholder="Ex: 29.90" required>
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="1" placeholder="Ex: 10" required>
            </div>

            <button type="submit">CADASTRAR PRODUTO</button>
        </form>

        <h2>Lista de Produtos</h2>

        <ul id="lista-produtos"></ul>
            
    </div>

    <script src="script.js"></script>
</body>

</html>
